services:
  nginx:
    image: nginx:1.21.6
    container_name: ecotaxa_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./vault:/vault
    networks:
      - econet
    ports:
      - "8088:80"
    depends_on:
      - ecotaxafront
      - ecotaxaback
    restart: unless-stopped

  ecotaxafront:
    build:
      context: ./services/ecotaxa_front/docker
      dockerfile: prod_image/Dockerfile
    container_name: ecotaxa_front
    volumes:
      - ./front_config:/app/config
    networks:
      - econet
    depends_on:
      - ecotaxaback
    restart: unless-stopped

  ecotaxaback:
    build:
      context: ./services/ecotaxa_back/docker
      dockerfile: prod_image/Dockerfile
    container_name: ecotaxa_back
    volumes:
      - ./back_config.ini:/config.ini
      - ./ftp_area:/ftp_area
      - ./file_srv:/file_srv
      - ./vault:/vault
      - ./models:/models
      - temp_jobs:/temp_jobs
      - ./eco_users_files:/eco_users_files
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - econet
    depends_on:
      pgdb:
        condition: service_healthy
    restart: unless-stopped

  # ML back-end: polls the shared job table directly and runs Prediction jobs
  # (Random Forest training/classification, plus deep-CNN feature extraction
  # if a GPU is available). Runs CPU-only here (no NVIDIA GPU on this host) --
  # the classical RF path doesn't need one, only the deep-features ("Add deep
  # features" in the Prediction wizard) path does.
  ecotaxagpuback:
    build:
      context: ./services/ecotaxa_ML_back
      dockerfile: docker/prod_image/Dockerfile
    container_name: ecotaxa_gpu_back
    volumes:
      - ./back_config.ini:/config.ini
      - ./vault:/vault
      - ./models:/models
      - temp_jobs:/temp_jobs
    networks:
      - econet
    depends_on:
      pgdb:
        condition: service_healthy
    restart: unless-stopped

  pgdb:
    image: pgvector/pgvector:pg14
    container_name: ecotaxa_pgdb
    networks:
      - econet
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

networks:
  econet:
    driver: bridge

volumes:
  temp_jobs:
  pgdata:
