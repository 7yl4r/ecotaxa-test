#
# This is a 100% _NOT PRODUCTION READY_ nginx config, adapted from the
# official ecotaxa_front all_in_one example. It's fine for local/self-hosted
# use behind a trusted network; put a real TLS-terminating reverse proxy in
# front of it for anything internet-facing.
#
# IMPORTANT: directives below use hostnames (ecotaxaback and ecotaxafront)
# which correspond to docker-compose service names.
#
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stdout info;

events {
    worker_connections  128;
}

http {
    types_hash_max_size 2048;
    client_max_body_size 670M;
    client_body_timeout 360;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80 default_server;

        # Images live in the vault volume, served directly by nginx.
        location /vault/  {
               alias /vault/;
        }

        # Go straight to the back-end for /api calls.
        # Generous timeouts: some operations (e.g. the initial full
        # taxonomy pull from EcoTaxoServer) can take well over a minute.
        location /api/  {
               proxy_pass http://ecotaxaback:8000;
               proxy_connect_timeout 300;
               proxy_send_timeout 300;
               proxy_read_timeout 300;
        }

        # Everything else goes to the front-end (uwsgi).
        location / {
                include uwsgi_params;
                uwsgi_pass ecotaxafront:3030;
                uwsgi_read_timeout 600;
                uwsgi_send_timeout 600;
                proxy_buffering off;
                uwsgi_buffering off;
        }
    }
}
