# This is a basic workflow to help you get started with Actions

name: tests

# Controls when the action will run.
on:
  push:
  pull_request:
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  test:
    permissions:
#      pull-requests: write
      contents: read

    environment: Env_for_Actions
    # The type of runner that the job will run on
    runs-on: [ubuntu-latest]
    # Virgin container
    container: ubuntu:22.04

    # Service containers to run with `container-job`
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: pgvector/pgvector:0.8.2-pg18-trixie
        # Provide the password for postgres
        env:
          POSTGRES_PASSWORD: postgres12
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5           
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # old version of python from this ppa
    - run: apt-get update
    - run: apt-get install software-properties-common gpg-agent --no-install-recommends --yes
    # - run: apt-get update
    - run: TZ=Etc/UTC ln -snf /usr/share/zoneinfo/$TZ /etc/localtime && echo $TZ > /etc/timezone
    - run: add-apt-repository ppa:deadsnakes/ppa
    - run: apt-get update
    # python & psql (for the test DB) from repo, same as prod docker
    - run: apt-get install
        python3.8 python3-venv python3.8-dev python3.8-venv
        postgresql-client-14 libpq-dev
        gcc make file cython3
        --no-install-recommends --yes
    - run: python3.8 -m venv /venv
    - run: PATH=/venv/bin pip3 install --upgrade pip wheel
    # Checkout.
    - uses: actions/checkout@v5
      with:
        path: '.'
      # Run both tests and coverage
    - run: PATH=/venv/bin:$PATH pip3 install "tox<4.0.0"

    - name: Run tox
      run: |
        PATH=/venv/bin:$PATH tox
      env:
        # The hostname used to communicate with the PostgreSQL service container
        POSTGRES_HOST: postgres
        # The default PostgreSQL port
        POSTGRES_PORT: 5432

    - name: Pytest coverage comment
      uses: MishaKav/pytest-coverage-comment@v1.7.2
      with:
          pytest-xml-coverage-path: ./coverage.xml
          title: EcoTaxa ML backend coverage
          badge-title: Coverage
          hide-comment: true
#          remove-links-to-files: true
          remove-links-to-lines: true
          xml-skip-covered: true
